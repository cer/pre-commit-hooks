# A Kotlin or Java project built with Gradle: the base hooks, CodeScene and the build.
# Copy to .pre-commit-config.yaml, then run:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/cer/pre-commit-hooks
    rev: v1.0.0
    hooks:
      - id: gitleaks-staged
      - id: gitleaks-commit-message
      - id: block-claude-coauthor
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: run-codescene
        name: Run CodeScene
        entry: codescene-precommit.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]
      - id: gradle-build
        name: Run ./gradlew build
        entry: ./gradlew build
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
